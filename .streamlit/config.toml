# Look and feel of the Streamlit app (app.py): a clean, Apple-style light theme.

[theme]
base = "light"
primaryColor = "#0071e3"              # Apple blue: buttons, links, selected controls
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f7"  # light gray for cards and inputs
textColor = "#1d1d1f"
linkColor = "#0066cc"
borderColor = "#d2d2d7"
# Inter is the closest free web font to Apple's San Francisco.
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFontWeights = [700, 600, 600, 600, 600, 600]
baseRadius = "12px"
buttonRadius = "full"                 # pill-shaped buttons

[client]
toolbarMode = "viewer"                # hide the developer menu and Deploy button

[browser]
gatherUsageStats = false
